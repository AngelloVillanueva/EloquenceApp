<circle cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-dasharray="10 20" stroke-width="1"></circle>
</svg>
<!-- Core Orb (Animated SVG representing 3D Mesh) -->
<svg class="w-32 h-32 text-primary drop-shadow-[0_0_15px_rgba(232,168,124,0.6)]" id="core-orb" viewbox="0 0 100 100">
<defs>
<radialgradient cx="50%" cy="50%" id="orbGlow" r="50%">
<stop offset="0%" stop-color="#FFDCC6" stop-opacity="1"></stop>
<stop offset="60%" stop-color="#E8A87C" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#85532E" stop-opacity="0.2"></stop>
</radialgradient>
<filter id="blurFilter">
<fegaussianblur in="SourceGraphic" stddeviation="2"></fegaussianblur>
</filter>
</defs>
<circle cx="50" cy="50" fill="url(#orbGlow)" r="40"></circle>

<g fill="none" stroke="#FFF" stroke-opacity="0.3" stroke-width="0.3">
<ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(30 50 50)"></ellipse>
<ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(90 50 50)"></ellipse>
<ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(150 50 50)"></ellipse>

<circle cx="50" cy="50" fill="#FFF" filter="url(#blurFilter)" opacity="0.8" r="10">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="8; 12; 8"></animate>
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="0.6; 1; 0.6"></animate>

<span class="w-1 h-1 bg-primary rounded-full animate-bounce" style="animation-delay: 150ms;"></span>

</span>

</div>
</div>

<script>
    // Micro-interactions for the orb and button
    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const orbContainer = document.getElementById('orb-container');
        const coreOrb = document.getElementById('core-orb');
        let isSessionActive = false;

        startBtn.addEventListener('click', () => {
            isSessionActive = !isSessionActive;
            
            if (isSessionActive) {
                // Change button state
                startBtn.textContent = 'Listening...';
                startBtn.classList.replace('bg-primary', 'bg-[#E85D4E]');
                startBtn.classList.replace('text-[#12100E]', 'text-white');
                startBtn.classList.replace('shadow-[0_4px_14px_0_rgba(232,168,124,0.39)]', 'shadow-[0_4px_14px_0_rgba(232,93,78,0.39)]');
                
                // Animate orb more vigorously
                coreOrb.style.transform = 'scale(1.1)';
                coreOrb.style.transition = 'transform 0.3s ease-out';
                
                // Add a pulsating effect to the container
                orbContainer.classList.add('animate-pulse');
                
            } else {
                // Reset to start state
                startBtn.textContent = 'Start Session';
                startBtn.classList.replace('bg-[#E85D4E]', 'bg-primary');
                startBtn.classList.replace('text-white', 'text-[#12100E]');
                startBtn.classList.replace('shadow-[0_4px_14px_0_rgba(232,93,78,0.39)]', 'shadow-[0_4px_14px_0_rgba(232,168,124,0.39)]');
                
                // Reset orb
                coreOrb.style.transform = 'scale(1)';
                orbContainer.classList.remove('animate-pulse');
            }
        });

        // Simple mouse tracking for a subtle parallax effect on the orb (desktop only, but good for touch on mobile if implemented carefully)
        // Kept simple for robust mobile experience
    });
</script>
