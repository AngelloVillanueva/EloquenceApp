[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elevate-ai"
version = "0.1.0"
description = "100% local English voice tutor (STT + LLM + TTS) for RTX 3060"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
